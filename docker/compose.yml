# Linux amd64：一个开发容器，宿主仅需 Code / Docker / Git。
name: bangumi-android-dev

services:
  dev:
    # initializeCommand builds this local image using Docker's layer cache.
    # No build here: Dev Containers must not rebuild a temporary Dockerfile.
    image: bangumi-android-dev:local
    pull_policy: never
    platform: linux/amd64
    working_dir: /repo
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: [workbench]
    volumes:
      # The real repository, including Git and project-generated files.
      - type: bind
        source: ..
        target: /repo
        bind:
          create_host_path: false
      # Only user-level caches and the container's own ADB identity use volumes.
      - gradle-home:/home/dev/.gradle
      - cargo-registry:/home/dev/.cargo/registry
      - cargo-git:/home/dev/.cargo/git
      - yarn-cache:/home/dev/.cache/yarn
      - adb-state:/home/dev/.android

networks:
  default:
    driver: bridge

volumes:
  gradle-home:
  cargo-registry:
  cargo-git:
  yarn-cache:
  adb-state:

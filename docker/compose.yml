# Linux amd64：一个开发容器，宿主仅需 Code / Docker / Git。
name: bangumi-android-dev

services:
  dev:
    # initializeCommand builds a fingerprinted image once and overrides this tag.
    # No build here: Dev Containers must not rebuild a temporary Dockerfile.
    image: bangumi-android-dev:initialize-through-vscode
    pull_policy: never
    platform: linux/amd64
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /repo
    init: true
    network_mode: host
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      BANGUMI_CONTAINER: "1"
      BANGUMI_ADB_SERVER_MODE: ${BANGUMI_ADB_SERVER_MODE:-container}
      BANGUMI_ANDROID_ABI: ${BANGUMI_ANDROID_ABI:-arm64-v8a}
      BANGUMI_BUILD_JOBS: ${BANGUMI_BUILD_JOBS:-4}
      ADB_SERVER_SOCKET: tcp:127.0.0.1:5037
    command: [workbench]
    volumes:
      # The real repository, including Git and project-generated files.
      - type: bind
        source: ..
        target: /repo
        bind:
          create_host_path: false
      # Android runtime view: only its configuration is image-generated.
      # These paths are the same host files as /repo, not copied project data.
      - type: bind
        source: ../src
        target: /workspace/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../android
        target: /workspace/android
        bind:
          create_host_path: false
      - type: bind
        source: ../node_modules
        target: /workspace/node_modules
        bind:
          create_host_path: false
      - type: bind
        source: ../metro-cache
        target: /workspace/metro-cache
        bind:
          create_host_path: false
      # Only user-level caches and the container's own ADB identity use volumes.
      - gradle-home:/home/dev/.gradle
      - cargo-registry:/home/dev/.cargo/registry
      - cargo-git:/home/dev/.cargo/git
      - yarn-cache:/home/dev/.cache/yarn
      - adb-state:/home/dev/.android

volumes:
  gradle-home:
  cargo-registry:
  cargo-git:
  yarn-cache:
  adb-state:
